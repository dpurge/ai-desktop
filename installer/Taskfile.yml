version: "3"

includes:
  engine:
    taskfile: ../engine/Taskfile.yml
    dir: ../engine
  gui:
    taskfile: ../desktop/Taskfile.yml
    dir: ../desktop

vars:
  # Tauri's per-platform bundle folder for the host output.
  BUNDLE_DIR: '{{if eq OS "windows"}}nsis{{else}}macos{{end}}'

tasks:
  sidecar:
    desc: Freeze the engine into engine/dist/backend
    cmds:
      - task: engine:sidecar

  bundle:
    desc: Build the .app with the frozen engine inside (needs `sidecar` first)
    cmds:
      - task: gui:bundle

  release:
    desc: Build the engine, bundle the app, and copy the installer output to installer/dist/
    cmds:
      - task: sidecar
      - task: bundle
      - rm -rf dist && mkdir -p dist
      - cp -R "../desktop/src-tauri/target/release/bundle/{{.BUNDLE_DIR}}/." dist/
      - |
        echo "Built installer output in: $(cd dist && pwd)"
        ls -la dist

  clean:
    desc: Remove the frozen engine, the bundled app, and the installer output
    cmds:
      - rm -rf dist ../engine/dist ../engine/build ../desktop/src-tauri/target/release/bundle
