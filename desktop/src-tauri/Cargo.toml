[package]
name = "ai-desktop"
version = "0.1.0"
description = "AI Desktop shell"
edition = "2021"

[lib]
name = "ai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
shell-words = "1"
uuid = { version = "1", features = ["v4"] }
